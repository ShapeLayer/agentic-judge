[package]
name = "agentic-judge"
version = "0.1.0"
edition = "2024"
include = ["/src/**", "/ui/app/**", "/ui/styles/tokens.css", "/prompts/**", "/vendor/testlib/**", "/runtime/Containerfile", "/build.rs", "/Cargo.toml", "/Cargo.lock", "/README.md"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
libc = "0.2"
toml = "0.8"
fs2 = "0.4"
pulldown-cmark = "0.12"
ammonia = "4"
latex2mathml = "0.2"
tiny_http = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
roxmltree = "0.21.1"
scraper = "0.27.0"
serde_yaml = "0.9.34"

zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
